# Painel de administração da iTrend (Decap CMS)
#
# Login com e-mail e senha pelo DecapBridge (classic)
backend:
  name: git-gateway
  repo: pauloddev/itrend
  branch: main
  identity_url: https://auth.decapbridge.com/sites/d79fc9c0-d741-4f21-b1ae-7e6e74b72752
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "Painel: cria {{collection}} “{{slug}}” - {{author-name}} via DecapBridge"
    update: "Painel: atualiza {{collection}} “{{slug}}” - {{author-name}} via DecapBridge"
    delete: "Painel: remove {{collection}} “{{slug}}” - {{author-name}} via DecapBridge"
    uploadMedia: "Painel: envia “{{path}}” - {{author-name}} via DecapBridge"
    deleteMedia: "Painel: apaga “{{path}}” - {{author-name}} via DecapBridge"
    openAuthoring: "{{message}} - {{author-name}} via DecapBridge"

# Para testar no seu computador: npx decap-server e abra http://localhost:3000/admin/
local_backend: true

locale: pt
site_url: https://itrend.vercel.app
display_url: https://itrend.vercel.app
logo_url: /img/logo-itrend.svg
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: "Conteúdo do site"
    label_singular: "Seção"
    description: "Cada item é uma parte do site. Depois de publicar, o site atualiza em cerca de 1 minuto."
    editor:
      preview: false
    files:
      - name: geral
        label: "⚙️ Dados da loja e horário"
        file: content/geral.json
        description: "Telefone, WhatsApp, endereço, horário e dados para o Google."
        fields:
          - { name: nome_loja, label: "Nome da loja", widget: string }
          - { name: telefone, label: "Telefone (como aparece no site)", widget: string }
          - { name: whatsapp, label: "Número do WhatsApp (só números, com 55 e DDD)", widget: string, hint: "Exemplo: 5595991383639" }
          - { name: mensagem_whatsapp, label: "Mensagem padrão do WhatsApp", widget: string }
          - { name: email, label: "E-mail", widget: string }
          - { name: instagram, label: "Instagram (sem @)", widget: string }
          - { name: endereco_rua, label: "Endereço: rua e número", widget: string }
          - { name: endereco_complemento, label: "Endereço: bairro, cidade, estado e CEP", widget: string }
          - { name: endereco_mapa, label: "Endereço completo para o mapa", widget: string, hint: "Usado para posicionar o mapa e o botão Como chegar." }
          - { name: bairro, label: "Bairro", widget: string }
          - { name: cidade, label: "Cidade", widget: string }
          - { name: estado, label: "Estado (sigla)", widget: string }
          - { name: cep, label: "CEP", widget: string }
          - { name: aviso_horario, label: "Aviso ao lado do horário", widget: string, hint: "Ex.: Não fechamos para almoço. Deixe vazio para não mostrar." }
          - { name: horarios, label: "Horário de funcionamento", widget: list, summary: "{{fields.dia}}: {{fields.abre}} às {{fields.fecha}}", fields: [{ name: dia, label: "Dia", widget: string, hint: "Ex.: Segunda-feira" }, { name: abre, label: "Abre às", widget: string, hint: "Formato 08:00" }, { name: fecha, label: "Fecha às", widget: string, hint: "Formato 19:00" }, { name: fechado, label: "Fechado neste dia?", widget: boolean, default: false, required: false }] }
          - { name: ceo_nome, label: "Nome da CEO", widget: string }
          - { name: nota_garantia, label: "Observação da garantia (rodapé)", widget: string }
          - { name: rodape_texto, label: "Texto do rodapé", widget: text }
          - { name: seo_titulo, label: "Título no Google e na aba do navegador", widget: string }
          - { name: seo_descricao, label: "Descrição no Google (até 160 caracteres)", widget: text }
          - { name: site_url, label: "Endereço do site", widget: string, hint: "Ex.: https://itrend.vercel.app (sem barra no final)" }
      - name: inicio
        label: "🏠 Topo do site"
        file: content/inicio.json
